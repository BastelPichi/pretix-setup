[pretix]
instance_name=Pretix
url=https://pretix.domain.com
currency=EUR
; DO NOT change the following value, it has to be set to the location of the
; directory *inside* the docker container
datadir=/data
trust_x_forwarded_for=on
trust_x_forwarded_proto=on

[database]
backend=postgresql
name=pretix
user=pretix
; Replace with the password you chose in your docker-compose
password=PasswordHere
host=postgres

[mail]
from=tickets@domain.com
host=mailhost.com
user=tickets@domain.com
password=PasswordHere
port=465
tls=off
ssl=on

[redis]
location=redis://redis:6379/0
sessions=true

[celery]
backend=redis://redis:6379/1
broker=redis://redis:6379/2
